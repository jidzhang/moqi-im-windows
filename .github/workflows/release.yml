name: Release

# Tag-driven releases: push a tag like v1.0.0 and the installer is built from
# that tag, with the version number injected into the binaries and the Inno
# Setup package (version.txt is the single source of truth).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build (must already exist), e.g. v1.0.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PROTOBUF_VERSION: "36.2"

jobs:
  build-release:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell

    steps:
      - name: Resolve version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+([-+][0-9A-Za-z.\-]+)?$') {
            throw "Tag must look like v1.2.3 (optional suffix, e.g. v1.2.3-beta.1): '$tag'"
          }
          $version = $tag.Substring(1)
          $prerelease = if ($version.Contains('-')) { 'true' } else { 'false' }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          Write-Host "Release tag: $tag / version: $version / prerelease: $prerelease"

      - name: Checkout moqi-im-windows
        uses: actions/checkout@v4
        with:
          path: moqi-im-windows
          submodules: recursive
          fetch-depth: 0
          ref: ${{ steps.version.outputs.tag }}

      - name: Checkout moqi-ime
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moqi-ime
          path: moqi-ime
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: moqi-ime/go.mod
          cache-dependency-path: moqi-ime/go.sum

      - name: Ensure Inno Setup 6
        run: |
          $iscc = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if ($iscc) {
            Write-Host "Inno Setup already installed: $iscc"
          } else {
            choco install innosetup --yes --no-progress
          }

      - name: Cache protoc
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/protoc-${{ env.PROTOBUF_VERSION }}-win64
          key: protoc-${{ env.PROTOBUF_VERSION }}

      - name: Download protoc
        run: |
          $protocRoot = Join-Path $env:RUNNER_TEMP "protoc-$env:PROTOBUF_VERSION-win64"
          if (Test-Path -LiteralPath (Join-Path $protocRoot "bin\protoc.exe")) {
            Write-Host "protoc cache hit: $protocRoot"
          } else {
            $zipPath = Join-Path $env:RUNNER_TEMP "protoc-$env:PROTOBUF_VERSION-win64.zip"
            Invoke-WebRequest `
              -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOBUF_VERSION/protoc-$env:PROTOBUF_VERSION-win64.zip" `
              -OutFile $zipPath
            Expand-Archive -Path $zipPath -DestinationPath $protocRoot -Force
          }
          "PROTOBUF_ROOT=$protocRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Cache CMake third-party deps
        # protobuf/absl FetchContent 编译约 8~10 分钟，是单次构建的大头。
        # 键钉 PROTOBUF_VERSION：升依赖时手动改键，未命中即回退现编（无风险）。
        uses: actions/cache@v4
        with:
          path: |
            moqi-im-windows/build-vs32/_deps
            moqi-im-windows/build-vs64/_deps
          key: cmake-deps-${{ env.PROTOBUF_VERSION }}-v1

      - name: Build installer
        working-directory: ${{ github.workspace }}/moqi-im-windows
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\_all_in_package.ps1 `
            -RepoRoot "$env:GITHUB_WORKSPACE\moqi-im-windows" `
            -MoqiImeRoot "$env:GITHUB_WORKSPACE\moqi-ime" `
            -ProtobufRoot "$env:PROTOBUF_ROOT" `
            -Version "${{ steps.version.outputs.version }}"

      - name: Cache frozen gram assets
        uses: actions/cache@v4
        with:
          # essay(206MB)/wanxiang(398MB) 两个大模型确定不再修改，缓存省下载。
          # 一旦替换这两个文件，手动把 key 的 v1 递增。
          path: |
            moqi-im-windows/installer/dist/zh-hans-t-essay-bgw.gram
            moqi-im-windows/installer/dist/wanxiang-lts-zh-hans.gram
          key: gram-frozen-v1

      - name: Fetch built-in gram assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 内置语法模型不在仓库里（均 gitignore）：统一从本仓内部 release
          # gram-assets 取（draft，用户侧不可见）。按 API 报告的 size 校验
          # 落盘长度，不硬编码字节数——std/dummy/wiki 三个后续可能更新。
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $gramDir = Join-Path $env:GITHUB_WORKSPACE 'moqi-im-windows/installer/dist'
          New-Item -ItemType Directory -Force -Path $gramDir | Out-Null

          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases?per_page=100" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $assetRelease = $releases | Where-Object { $_.tag_name -eq 'gram-assets' } | Select-Object -First 1
          if (-not $assetRelease) { throw "Internal release 'gram-assets' not found" }

          $wanted = @(
            'zh-moqi.gram',
            'zh-moqi-dummy.gram',
            'zh-moqi-wiki.gram',
            'zh-hans-t-essay-bgw.gram',
            'wanxiang-lts-zh-hans.gram'
          )
          foreach ($name in $wanted) {
            $asset = $assetRelease.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if (-not $asset) { throw "gram asset missing from gram-assets: $name" }
            $outPath = Join-Path $gramDir $name
            if ((Test-Path -LiteralPath $outPath) -and ((Get-Item -LiteralPath $outPath).Length -eq $asset.size)) {
              Write-Host "gram cache hit: $name"
              continue
            }
            Write-Host "downloading $name ($($asset.size) bytes)"
            Invoke-WebRequest -Uri $asset.url -OutFile $outPath `
              -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream' }
            $len = (Get-Item -LiteralPath $outPath).Length
            if ($len -ne $asset.size) {
              throw "gram size mismatch for ${name}: got $len, expected $($asset.size)"
            }
          }

      - name: Build all installer tiers
        working-directory: ${{ github.workspace }}/moqi-im-windows
        run: |
          # 五档共用 _all_in_package.ps1 生成的同一个 stage，只靠
          # -OutputName / -ExcludeBuild / -GramPath 区分。与本地
          # _all_local_packages.ps1 必须同构：改一处要同步另一处。
          $version = "${{ steps.version.outputs.version }}"
          $dist = 'installer/dist'
          $bi = './installer/build-installer.ps1'
          $grams = @{
            std      = Join-Path $dist 'zh-moqi.gram'
            dummy    = Join-Path $dist 'zh-moqi-dummy.gram'
            wiki     = Join-Path $dist 'zh-moqi-wiki.gram'
            essay    = Join-Path $dist 'zh-hans-t-essay-bgw.gram'
            wanxiang = Join-Path $dist 'wanxiang-lts-zh-hans.gram'
          }

          # 标准档：内置轻量长句增强（v1.7.0 起）
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $bi `
            -StageDir ./installer/stage -OutputName moqi-im-windows-setup `
            -GramPath $grams.std -Version $version
          if ($LASTEXITCODE -ne 0) { throw 'standard tier failed' }

          # lite 档：1KB dummy gram（BeamSearch 开关，无内容）
          # Excludes 里的路径必须用反斜杠（Inno 的 [Files] Excludes 按 Windows 分隔符匹配，
          # 正斜杠不生效 → 预编译词库缓存剔不掉，lite 白胖 40MB）。
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $bi `
            -StageDir ./installer/stage -OutputName moqi-im-windows-setup-lite `
            -ExcludeBuild 'moqi-ime\input_methods\rime\data\build\*' `
            -GramPath $grams.dummy -Version $version
          if ($LASTEXITCODE -ne 0) { throw 'lite tier failed' }

          # wiki 档：书面语/百科风格的长句增强
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $bi `
            -StageDir ./installer/stage -OutputName moqi-im-windows-setup-wiki `
            -GramPath $grams.wiki -Version $version
          if ($LASTEXITCODE -ne 0) { throw 'wiki tier failed' }

          # essay 档：八股文长句增强（原 full 档，v1.7.0 改名）
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $bi `
            -StageDir ./installer/stage -OutputName moqi-im-windows-setup-essay `
            -GramPath $grams.essay -Version $version
          if ($LASTEXITCODE -ne 0) { throw 'essay tier failed' }

          # wanxiang 档：万象语法模型
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $bi `
            -StageDir ./installer/stage -OutputName moqi-im-windows-setup-wanxiang `
            -GramPath $grams.wanxiang -Version $version
          if ($LASTEXITCODE -ne 0) { throw 'wanxiang tier failed' }

      - name: Verify embedded version
        working-directory: ${{ github.workspace }}/moqi-im-windows
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $numeric = ($version -split '[-+]')[0]
          $dll = "build-vs32\MoqiTextService\Release\MoqiTextService.dll"
          if (-not (Test-Path -LiteralPath $dll)) {
            throw "Missing build artifact: $dll"
          }
          $productVersion = "$((Get-Item -LiteralPath $dll).VersionInfo.ProductVersion)"
          Write-Host "MoqiTextService.dll ProductVersion = $productVersion"
          if (-not $productVersion.StartsWith($numeric)) {
            throw "DLL version '$productVersion' does not match release version '$version'"
          }

      - name: Generate checksums
        working-directory: ${{ github.workspace }}/moqi-im-windows
        run: |
          $assets = @(
            "installer\dist\moqi-im-windows-setup-${{ steps.version.outputs.version }}.exe",
            "installer\dist\moqi-im-windows-setup-wiki-${{ steps.version.outputs.version }}.exe",
            "installer\dist\moqi-im-windows-setup-lite-${{ steps.version.outputs.version }}.exe",
            "installer\dist\moqi-im-windows-setup-essay-${{ steps.version.outputs.version }}.exe",
            "installer\dist\moqi-im-windows-setup-wanxiang-${{ steps.version.outputs.version }}.exe"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Asset was not produced: $asset"
            }
          }
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path -Leaf $asset)"
          }
          $lines | Out-File -FilePath "installer\dist\SHA256SUMS.txt" -Encoding ascii
          Get-ChildItem "installer\dist" -File | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moqi-im-windows-${{ steps.version.outputs.tag }}
          path: |
            moqi-im-windows/installer/dist/moqi-im-windows-setup-${{ steps.version.outputs.version }}.exe
            moqi-im-windows/installer/dist/moqi-im-windows-setup-wiki-${{ steps.version.outputs.version }}.exe
            moqi-im-windows/installer/dist/moqi-im-windows-setup-lite-${{ steps.version.outputs.version }}.exe
            moqi-im-windows/installer/dist/moqi-im-windows-setup-essay-${{ steps.version.outputs.version }}.exe
            moqi-im-windows/installer/dist/moqi-im-windows-setup-wanxiang-${{ steps.version.outputs.version }}.exe
            moqi-im-windows/installer/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        working-directory: ${{ github.workspace }}/moqi-im-windows
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # GH 的 powershell shell 预置 ErrorActionPreference=stop：gh 查不到
          # release 时向 stderr 写"release not found"会被当作异常终止脚本，
          # 本步降级为 Continue，用 $LASTEXITCODE 显式判错。
          $ErrorActionPreference = 'Continue'
          $assets = @(
            "installer\dist\moqi-im-windows-setup-${{ steps.version.outputs.version }}.exe",
            "installer\dist\moqi-im-windows-setup-wiki-${{ steps.version.outputs.version }}.exe",
            "installer\dist\moqi-im-windows-setup-lite-${{ steps.version.outputs.version }}.exe",
            "installer\dist\moqi-im-windows-setup-essay-${{ steps.version.outputs.version }}.exe",
            "installer\dist\moqi-im-windows-setup-wanxiang-${{ steps.version.outputs.version }}.exe",
            "installer\dist\SHA256SUMS.txt"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Asset was not produced: $asset"
            }
          }
          gh release view $env:TAG > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists; uploading assets."
            gh release upload $env:TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          } else {
            gh release create $env:TAG @assets --title $env:TAG --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
          if ($env:PRERELEASE -eq 'true') {
            gh release edit $env:TAG --prerelease
          }

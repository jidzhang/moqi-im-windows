name: Nightly

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-master
  cancel-in-progress: true

env:
  PROTOBUF_VERSION: "36.2"

jobs:
  build-nightly:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout moqi-im-windows
        uses: actions/checkout@v4
        with:
          path: moqi-im-windows
          submodules: recursive
          fetch-depth: 0

      - name: Checkout moqi-ime
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moqi-ime
          path: moqi-ime
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: moqi-ime/go.mod
          cache-dependency-path: moqi-ime/go.sum

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Download protoc
        run: |
          $protocRoot = Join-Path $env:RUNNER_TEMP "protoc-$env:PROTOBUF_VERSION-win64"
          $zipPath = Join-Path $env:RUNNER_TEMP "protoc-$env:PROTOBUF_VERSION-win64.zip"

          if (Test-Path -LiteralPath $protocRoot) {
            Remove-Item -LiteralPath $protocRoot -Recurse -Force
          }

          Invoke-WebRequest `
            -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOBUF_VERSION/protoc-$env:PROTOBUF_VERSION-win64.zip" `
            -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $protocRoot -Force

          "PROTOBUF_ROOT=$protocRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build nightly installer
        working-directory: ${{ github.workspace }}/moqi-im-windows
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\_all_in_package.ps1 `
            -RepoRoot "$env:GITHUB_WORKSPACE\moqi-im-windows" `
            -MoqiImeRoot "$env:GITHUB_WORKSPACE\moqi-ime" `
            -ProtobufRoot "$env:PROTOBUF_ROOT"

      - name: Fetch built-in gram assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 与 release.yml 同源：内置语法模型统一从内部 release gram-assets
          # 取（draft，用户侧不可见），按 API size 校验落盘长度。
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $gramDir = Join-Path $env:GITHUB_WORKSPACE 'moqi-im-windows/installer/dist'
          New-Item -ItemType Directory -Force -Path $gramDir | Out-Null

          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases?per_page=100" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $assetRelease = $releases | Where-Object { $_.tag_name -eq 'gram-assets' } | Select-Object -First 1
          if (-not $assetRelease) { throw "Internal release 'gram-assets' not found" }

          foreach ($name in @('zh-moqi.gram')) {
            $asset = $assetRelease.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if (-not $asset) { throw "gram asset missing from gram-assets: $name" }
            $outPath = Join-Path $gramDir $name
            Invoke-WebRequest -Uri $asset.url -OutFile $outPath `
              -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream' }
            $len = (Get-Item -LiteralPath $outPath).Length
            if ($len -ne $asset.size) {
              throw "gram size mismatch for ${name}: got $len, expected $($asset.size)"
            }
          }

      - name: Rebuild standard installer with gram
        working-directory: ${{ github.workspace }}/moqi-im-windows
        run: |
          # _all_in_package 产出的标准包不带 gram；与 release 口径对齐，
          # 用 9MB zh-moqi.gram 重打一次标准档。
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\installer\build-installer.ps1 `
            -StageDir ./installer/stage `
            -OutputName moqi-im-windows-setup `
            -GramPath ./installer/dist/zh-moqi.gram
          if ($LASTEXITCODE -ne 0) { throw 'standard tier rebuild failed' }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moqi-im-windows-nightly-${{ github.sha }}
          path: ${{ github.workspace }}/moqi-im-windows/installer/dist/moqi-im-windows-setup-*.exe
          if-no-files-found: error

      - name: Publish nightly release
        working-directory: ${{ github.workspace }}/moqi-im-windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "nightly"
          $assetPath = Join-Path $PWD "installer\dist\moqi-im-windows-setup.exe"
          $notesPath = Join-Path $env:RUNNER_TEMP "nightly-notes.md"
          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

          @(
            "Automated nightly build from `main`."
            ""
            "Commit: $env:GITHUB_SHA"
            "Run: $runUrl"
          ) | Set-Content -LiteralPath $notesPath -Encoding utf8

          git tag --force $tag $env:GITHUB_SHA
          git push origin "refs/tags/$tag" --force

          $releaseListJson = gh release list --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to query existing releases."
          }
          $releaseList = $releaseListJson | ConvertFrom-Json
          $existingTag = $releaseList | Where-Object { $_.tagName -eq $tag } | Select-Object -ExpandProperty tagName -First 1

          if (-not [string]::IsNullOrWhiteSpace($existingTag)) {
            gh release upload $tag $assetPath --clobber
            gh release edit $tag --title "Nightly" --notes-file $notesPath
          }
          else {
            gh release create $tag $assetPath --title "Nightly" --notes-file $notesPath --prerelease
          }

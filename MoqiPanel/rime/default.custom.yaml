# MoqiPanel 专用：面板里所有标点键原样输出半角英文标点。
# 这是面板包自带数据目录里的补丁，只作用于本文件夹里的引擎，不涉及墨奇输入法本体
# 的任何切换逻辑（中英标点开关、Shift 联动都原样保留，只是两种状态下标点都是英文的）。
# 不想要时删掉本文件、再删 user\build 后重启面板即恢复中文标点。
patch:
  punctuator/half_shape:
    ','  : ','
    '.'  : '.'
    '<'  : '<'
    '>'  : '>'
    '/'  : '/'
    '?'  : '?'
    ';'  : ';'
    ':'  : ':'
    '''' : "'"
    '"'  : '"'
    '\'  : '\'
    '|'  : '|'
    '`'  : '`'
    '~'  : '~'
    '!'  : '!'
    '@'  : '@'
    '#'  : '#'
    '%'  : '%'
    '$'  : '$'
    '^'  : '^'
    '&'  : '&'
    '*'  : '*'
    '('  : '('
    ')'  : ')'
    '-'  : '-'
    '_'  : '_'
    '+'  : '+'
    '='  : '='
    '['  : '['
    ']'  : ']'
    '{'  : '{'
    '}'  : '}'
